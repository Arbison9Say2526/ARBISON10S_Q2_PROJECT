<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Directory - Instagram Dark</title>
    <!-- PyScript Releases -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    
    <!-- FontAwesome for Instagram & Modern UI Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        brand: ['Grand Hotel', 'cursive'],
                    },
                    colors: {
                        darkBg: '#0f1419',
                        darkCard: '#181818',
                        darkBorder: '#282828',
                        darkInput: '#222222',
                        igPink: '#e1306c',
                        igPurple: '#833ab4',
                        igOrange: '#f56040',
                        igYellow: '#fcaf45',
                        vipGold: '#fbbf24',
                    }
                }
            }
        }
    </script>
    <style>
        /* Instagram Story & Glow Effects */
        .ig-gradient-text {
            background: linear-gradient(45deg, #f56040, #e1306c, #833ab4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ig-gradient-bg {
            background: linear-gradient(135deg, #f56040 0%, #e1306c 50%, #833ab4 100%);
        }

        .ig-vip-ring {
            background: linear-gradient(45deg, #fce043 0%, #fb8080 30%, #e1306c 60%, #833ab4 100%);
            padding: 2px;
            border-radius: 9999px;
            box-shadow: 0 0 15px rgba(225, 48, 108, 0.35);
        }

        /* Floating Label input trick */
        .floating-input:focus ~ label,
        .floating-input:not(:placeholder-shown) ~ label {
            transform: translateY(-1.1rem) scale(0.75);
            color: #e1306c;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f1419;
        }
        ::-webkit-scrollbar-thumb {
            background: #282828;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #383838;
        }
    </style>
</head>
<body class="bg-darkBg text-gray-100 font-sans min-h-screen pb-12 antialiased selection:bg-igPink selection:text-white">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-50 bg-darkCard/80 backdrop-blur-xl border-b border-darkBorder shadow-lg">
        <div class="max-w-xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl ig-gradient-bg flex items-center justify-center text-white text-lg font-bold shadow-lg shadow-igPink/20">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div>
                    <h1 class="font-brand text-2xl font-bold tracking-wide ig-gradient-text leading-none">Student Club Member Directory</h1>
                    <p class="text-[11px] text-gray-400 font-medium tracking-tight mt-0.5">@studentclub • <span class="text-igPink">wow sounds so cool</span></p>
                </div>
            </div>
            <div class="flex items-center space-x-3 text-gray-300">
                <div class="px-2.5 py-1 rounded-full bg-darkInput border border-darkBorder text-[11px] font-semibold text-gray-400 flex items-center space-x-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>Live Sync</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-xl mx-auto px-4 pt-6 space-y-6">

        <!-- Member Registration Form Card -->
        <section class="bg-darkCard rounded-2xl border border-darkBorder p-5 shadow-2xl relative overflow-hidden">
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-igPink/10 rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="flex items-center justify-between mb-4 border-b border-darkBorder/60 pb-3">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-user-plus text-igPink text-sm"></i>
                    <h2 class="text-sm font-bold tracking-wide text-gray-200 uppercase">New Member Registration</h2>
                </div>
                <span class="text-[10px] bg-igPurple/20 text-igPink border border-igPink/30 font-semibold px-2 py-0.5 rounded-full">
                    Directory Entry
                </span>
            </div>

            <!-- Form Fields -->
            <div class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- First Name -->
                    <div class="relative bg-darkInput rounded-xl border border-darkBorder focus-within:border-igPink transition-all">
                        <input type="text" id="first_name" placeholder=" " class="floating-input w-full bg-transparent px-3.5 pt-5 pb-1.5 text-sm text-gray-100 outline-none placeholder-transparent">
                        <label for="first_name" class="absolute left-3.5 top-3 text-xs text-gray-400 pointer-events-none origin-left transition-all duration-200 font-medium">First Name</label>
                    </div>

                    <!-- Last Name -->
                    <div class="relative bg-darkInput rounded-xl border border-darkBorder focus-within:border-igPink transition-all">
                        <input type="text" id="last_name" placeholder=" " class="floating-input w-full bg-transparent px-3.5 pt-5 pb-1.5 text-sm text-gray-100 outline-none placeholder-transparent">
                        <label for="last_name" class="absolute left-3.5 top-3 text-xs text-gray-400 pointer-events-none origin-left transition-all duration-200 font-medium">Last Name</label>
                    </div>
                </div>

                <!-- Primary PyScript Action Button -->
                <button id="add-btn" py-click="add_member" class="w-full ig-gradient-bg hover:opacity-95 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-igPink/25 transition-all duration-200 active:scale-[0.98] flex items-center justify-center space-x-2 text-sm tracking-wide">
                    <i class="fa-solid fa-plus text-xs"></i>
                    <span>ADD MEMBER</span>
                </button>
            </div>
        </section>

        <!-- Directory Status & Output Feed -->
        <section class="bg-darkCard rounded-2xl border border-darkBorder overflow-hidden shadow-2xl">
            <!-- Feed Card Header -->
            <div class="px-5 py-3.5 border-b border-darkBorder bg-darkCard/50 flex items-center justify-between">
                <div class="flex items-center space-x-2.5">
                    <div class="w-7 h-7 rounded-full bg-igPink/20 text-igPink flex items-center justify-center text-xs font-bold border border-igPink/30">
                        <i class="fa-solid fa-id-card"></i>
                    </div>
                    <span class="text-xs font-bold text-gray-200 uppercase tracking-wider">Directory Roster</span>
                </div>
                <!-- Status Badge -->
                <h3 id="total_count" class="text-xs font-semibold text-gray-400">
                    Initializing roster...
                </h3>
            </div>

            <!-- All Members Display Container -->
            <div class="p-4 sm:p-5">
                <div id="members_list" class="min-h-[160px] flex items-center justify-center">
                    <p class="text-gray-500 text-xs italic text-center">
                        <i class="fa-solid fa-spinner fa-spin mr-1.5 text-igPink"></i> Syncing PyScript data...
                    </p>
                </div>
            </div>

            <!-- Instagram Feed Style Actions Footer -->
            <div class="px-5 py-3 bg-darkInput/40 border-t border-darkBorder flex items-center justify-between text-gray-400 text-xs">
                <div class="flex items-center space-x-4">
                    <span class="hover:text-igPink cursor-pointer transition flex items-center space-x-1">
                        <i class="fa-regular fa-heart text-sm"></i>
                        <span class="text-[11px] font-medium">1.2k Likes</span>
                    </span>
                    <span class="hover:text-igPurple cursor-pointer transition flex items-center space-x-1">
                        <i class="fa-regular fa-comment text-sm"></i>
                        <span class="text-[11px] font-medium">Comments</span>
                    </span>
                </div>
                <span class="text-[10px] text-gray-500 font-mono">Python Set Data</span>
            </div>
        </section>

    </main>

    <!-- PyScript Core Reference -->
    <script type="py" src="drill2.py"></script>

    <!-- Modern UI Simulation Script (Ensures immediate previewability & neat rendering) -->
    <script>
        // List of designated VIP members
        const VIP_MEMBERS = new Set([
            "Pareng G",
            "Employs Muswashans",
            "Max Imumoccupancy120"
        ]);

        // Default fallback state matching Python backend
        let allMembers = [
            "Alex Band", "Chito Miranda", "Chris Daughtry", "James Blunt",
            "Allison Burgers", "Employs Muswashans", "Max Imumoccupancy120",
            "Zayn Malik", "Harry Styles", "Liam Payne", "Louis Tomlinson",
            "Niall Horan", "Carlos Agassi", "Jhong Hilario", "Malupiton", "Pareng G"
        ];

        function isVIP(name) {
            return Array.from(VIP_MEMBERS).some(vip => name.toLowerCase().includes(vip.toLowerCase()));
        }

        function getInitials(name) {
            return name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
        }

        // Render functions to create super neat Instagram Dark grid items
        function renderNeatDirectory(membersList) {
            const container = document.getElementById('members_list');
            if (!container) return;

            // Sort members: VIPs first (enlargened), then alphabetical
            const sortedMembers = [...membersList].sort((a, b) => {
                const aVIP = isVIP(a);
                const bVIP = isVIP(b);
                if (aVIP && !bVIP) return -1;
                if (!aVIP && bVIP) return 1;
                return a.localeCompare(b);
            });

            let html = `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3 w-full">`;

            sortedMembers.forEach(member => {
                const vip = isVIP(member);
                const initials = getInitials(member);

                if (vip) {
                    // VIP Member Treatment: Enlargened, glossy gradient ring, gold VIP badge, glow
                    html += `
                        <div class="sm:col-span-2 relative p-3.5 rounded-2xl bg-gradient-to-r from-darkCard via-[#211a24] to-darkCard border border-igPink/40 shadow-xl flex items-center justify-between group hover:border-igPink transition-all duration-300">
                            <div class="flex items-center space-x-3.5">
                                <div class="ig-vip-ring flex-shrink-0">
                                    <div class="w-12 h-12 rounded-full bg-darkBg flex items-center justify-center text-white font-extrabold text-sm border-2 border-darkBg">
                                        <span class="ig-gradient-text">${initials}</span>
                                    </div>
                                </div>
                                <div>
                                    <div class="flex items-center space-x-2">
                                        <h4 class="text-sm font-bold text-white tracking-wide group-hover:text-igPink transition">${member}</h4>
                                        <span class="bg-gradient-to-r from-amber-400 to-amber-600 text-darkBg text-[10px] font-black px-2 py-0.5 rounded-md shadow-md flex items-center space-x-1">
                                            <i class="fa-solid fa-crown text-[9px]"></i>
                                            <span>VIP</span>
                                        </span>
                                    </div>
                                    <p class="text-[11px] text-amber-400/90 font-medium mt-0.5">Featured Member • Executive Spot</p>
                                </div>
                            </div>
                            <div class="pr-2">
                                <i class="fa-solid fa-circle-check text-igPink text-base shadow-sm"></i>
                            </div>
                        </div>
                    `;
                } else {
                    // Regular Member Treatment: Neat modern dark row
                    html += `
                        <div class="p-2.5 rounded-xl bg-darkInput/60 border border-darkBorder flex items-center justify-between hover:bg-darkInput hover:border-gray-700 transition group">
                            <div class="flex items-center space-x-3 min-w-0">
                                <div class="w-9 h-9 rounded-full bg-darkBorder flex-shrink-0 flex items-center justify-center text-xs font-bold text-gray-300 group-hover:bg-igPurple/30 group-hover:text-white transition">
                                    ${initials}
                                </div>
                                <span class="text-xs font-semibold text-gray-200 truncate group-hover:text-white transition">${member}</span>
                            </div>
                            <span class="text-[10px] text-gray-500 font-medium px-2 py-0.5 rounded bg-darkBg border border-darkBorder">Member</span>
                        </div>
                    `;
                }
            });

            html += `</div>`;
            container.innerHTML = html;

            // Update Total Count cleanly
            const countEl = document.getElementById('total_count');
            if (countEl) {
                countEl.innerHTML = `<span class="text-gray-300">Total Roster:</span> <span class="text-igPink font-bold">${membersList.length} Members</span>`;
            }
        }

        // MutationObserver to sanitize raw PyScript output string into neat UI
        const observer = new MutationObserver(() => {
            const container = document.getElementById('members_list');
            if (container && container.innerText.includes("All Members:")) {
                const rawText = container.innerText;
                const match = rawText.match(/\{([^}]+)\}/);
                if (match && match[1]) {
                    const parsedMembers = match[1].replace(/'/g, "").split(',').map(s => s.trim());
                    renderNeatDirectory(parsedMembers);
                }
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            renderNeatDirectory(allMembers);
            const target = document.getElementById('members_list');
            if (target) {
                observer.observe(target, { childList: true, subtree: true, characterData: true });
            }

            // Fallback interactive click handler for preview
            const addBtn = document.getElementById('add-btn');
            addBtn.addEventListener('click', () => {
                const first = document.getElementById('first_name').value.trim();
                const last = document.getElementById('last_name').value.trim();
                if (first || last) {
                    const fullName = `${first} ${last}`.trim();
                    if (!allMembers.includes(fullName)) {
                        allMembers.push(fullName);
                        renderNeatDirectory(allMembers);
                    }
                }
            });
        });
    </script>
</body>
</html>
